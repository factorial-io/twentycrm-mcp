[package]
name = "twentycrm-mcp"
version = "0.2.0"
edition = "2021"
description = "MCP server for TwentyCRM exposing CRM operations as tools"
license = "MPL-2.0"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# MCP protocol
rmcp = { version = "1.2.0", features = ["server", "transport-streamable-http-server"] }

# OAuth/OIDC: GitLab login upstream, grantry as the MCP clients' authorization server
openidconnect = "3.5"
grantry = { version = "0.5", features = ["axum"] }
grantry-redis = "0.1"
async-trait = "0.1"

# HTTP client for TwentyCRM API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# OAuth state storage
redis = { version = "1.0", features = ["tokio-comp", "aio", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto / Auth
secrecy = { version = "0.10", features = ["serde"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
http = "1"
futures = "0.3"
url = "2"
http-body-util = "0.1"

[dev-dependencies]
